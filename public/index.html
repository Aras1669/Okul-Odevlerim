<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Okul Ödevlerim</title>
  <meta name="description" content="Okul Ödevlerim: öğretmenler için sınıf ve ödev yönetimi, öğrenciler için kolay teslim.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Atkinson Hyperlegible"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Bricolage Grotesque"', '"Atkinson Hyperlegible"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: { ink: '#1B2A41', paper: '#F4F7FB', pen: '#2554D9', margin: '#C93642', marker: '#FFE45E' },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="fixed bottom-4 right-4 z-50 flex max-w-[calc(100vw-2rem)] flex-col gap-2" aria-live="polite"></div>
  <noscript><p style="padding:2rem">Okul Ödevlerim çalışmak için JavaScript'e ihtiyaç duyar. Tarayıcında JavaScript'i aç.</p></noscript>
  <script src="app.js" defer></script>

</html>
